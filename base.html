<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Verify a credential{% endblock %}</title>
<style>
:root{--green:#14532d;--ink:#1f2933;--muted:#52606d;--line:#d9dfd6;--paper:#f6f7f3;--bad:#9b1c1c;--warn:#8a5a00}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper)}
header{background:var(--green);color:#fff;padding:14px 20px}
main{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin:14px 0}
label{display:block;margin:0 0 6px;font-weight:600}
input{width:100%;padding:9px;border:1px solid #aab4a6;border-radius:6px;font:inherit}
button{margin-top:12px;background:var(--green);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;font-weight:700;border:2px solid}
.valid{color:var(--green);border-color:var(--green)}
.revoked,.not_found,.nomatch,.invalid{color:var(--bad);border-color:var(--bad)}
.expired{color:var(--warn);border-color:var(--warn)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{width:36%;color:var(--muted)}
small{color:var(--muted)}
</style>
</head>
<body>
<header><strong>Credential verification</strong></header>
<main>{% block body %}{% endblock %}
<p><small>Learning prototype. Documents issued by it are demonstration documents only.</small></p></main>
</body>
</html>
